[package]
name = "flux-generator"
version = "0.1.0"
description = "AI Image Generation with Flux"
authors = ["you"]
edition = "2021"

[lib]
name = "flux_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = "0.4"

# Candle 0.9 alpha (CPU-only first, then add CUDA after testing)
# CUDA 13.1 has header conflicts with glibc, need to resolve separately
candle-core = "0.9.2-alpha.2"
candle-nn = "0.9.2-alpha.2"
candle-transformers = "0.9.2-alpha.2"
hf-hub = { version = "0.3", features = ["tokio"] }
tokenizers = "0.15"
safetensors = "0.4"
image = "0.25"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
