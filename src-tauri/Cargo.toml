[package]
name = "rzem-ai-inference"
version = "0.1.0"
description = "Local AI Image Generation"
authors = ["you"]
edition = "2021"
default-run = "rzem-ai-inference"

[lib]
name = "rzem_ai_inference"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = "0.4"

# Candle ML framework - GPU features are platform-specific (see below)
candle-core = "0.8.4"
candle-nn = "0.8.4"
candle-transformers = "0.8.4"     
hf-hub = { version = "0.3", features = ["tokio"] }
tokenizers = "0.15"
safetensors = "0.4"
image = "0.25"
png = "0.17"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
dotenvy = "0.15"
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"

# Logging - tracing for async-aware structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# =============================================================================
# Platform-specific GPU acceleration
# =============================================================================

# Linux: CUDA 12.8 support (patched for glibc 2.42 compatibility)
# See fix_cuda_glibc.sh for header patches applied to /usr/local/cuda
[target.'cfg(target_os = "linux")'.dependencies]
candle-core = { version = "0.8.4", features = ["cuda"] }
candle-nn = { version = "0.8.4", features = ["cuda"] }
candle-transformers = { version = "0.8.4", features = ["cuda"] }

# macOS: Metal support for Apple Silicon
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8.4", features = ["metal"] }
candle-nn = { version = "0.8.4", features = ["metal"] }
candle-transformers = { version = "0.8.4", features = ["metal"] }

# =============================================================================
# CLI Binary
# =============================================================================

[[bin]]
name = "rzem-cli"
path = "src/bin/rzem-cli.rs"
