[package]
name = "rzem-ai-inference"
version = "0.1.0"
description = "Local AI Image Generation"
authors = ["you"]
edition = "2021"
default-run = "rzem-ai-inference"

[lib]
name = "rzem_ai_inference"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = "0.4"
blake2 = "0.10"
blake3 = "1.5"

# Candle ML framework - GPU features are platform-specific (see below)
# Using local fork for LoRA-aware quantization support
candle-core = { path = "/home/alex/Dev/Work/candle/candle-core", version = "0.9.2" }
candle-nn = { path = "/home/alex/Dev/Work/candle/candle-nn", version = "0.9.2" }
candle-transformers = { path = "/home/alex/Dev/Work/candle/candle-transformers", version = "0.9.2" }     
hf-hub = { version = "0.4", features = ["tokio"] }
tokenizers = "0.20"
safetensors = "0.4"
half = "2.4"
image = "0.25"
png = "0.17"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
dotenvy = "0.15"
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
sysinfo = "0.32"

# Batch scripting support
csv = "1.3"
minijinja = "2.4"

# Logging - tracing for async-aware structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Server mode dependencies
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-tungstenite = "0.21"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tempfile = "3.24.0"

# =============================================================================
# Platform-specific GPU acceleration
# =============================================================================

# Linux: CUDA 12.8 support (patched for glibc 2.42 compatibility)
# See fix_cuda_glibc.sh for header patches applied to /usr/local/cuda
[target.'cfg(target_os = "linux")'.dependencies]
candle-core = { path = "/home/alex/Dev/Work/candle/candle-core", version = "0.9.2", features = ["cuda"] }
candle-nn = { path = "/home/alex/Dev/Work/candle/candle-nn", version = "0.9.2", features = ["cuda"] }
candle-transformers = { path = "/home/alex/Dev/Work/candle/candle-transformers", version = "0.9.2", features = ["cuda"] }

# macOS: Metal support for Apple Silicon
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { path = "/home/alex/Dev/Work/candle/candle-core", version = "0.9.2", features = ["metal"] }
candle-nn = { path = "/home/alex/Dev/Work/candle/candle-nn", version = "0.9.2", features = ["metal"] }
candle-transformers = { path = "/home/alex/Dev/Work/candle/candle-transformers", version = "0.9.2", features = ["metal"] }

# =============================================================================
# CLI Binaries
# =============================================================================

[[bin]]
name = "rzem-cli"
path = "src/bin/rzem-cli.rs"
